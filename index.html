<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 人格测试 · 找到你的 4 字母类型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --card: rgba(255,255,255,.055);
    --border: rgba(255,255,255,.10);
    --text: #eef1f8;
    --muted: #8b93a7;
    --accent: #7c6cf5;
    --accent-2: #38bdf8;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    background:
      radial-gradient(circle at 12% 12%, rgba(124,108,245,.30), transparent 45%),
      radial-gradient(circle at 88% 82%, rgba(56,189,248,.20), transparent 45%),
      #080b14;
    -webkit-font-smoothing: antialiased;
  }

  .app { width: min(680px, 100%); }

  .screen { display: none; }
  .screen.active { display: block; animation: fade .45s ease; }
  @keyframes fade {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============ 首页 ============ */
  #intro { text-align: center; padding: 32px 0 12px; }

  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .35em;
    text-indent: .35em;
    color: var(--accent-2);
    border: 1px solid rgba(56,189,248,.35);
    background: rgba(56,189,248,.08);
    padding: 6px 16px;
    border-radius: 999px;
    margin-bottom: 26px;
  }

  h1.hero {
    font-size: 38px;
    line-height: 1.25;
    letter-spacing: -.5px;
    background: linear-gradient(120deg, #fff 20%, #a78bfa 60%, #38bdf8 95%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 18px;
  }

  .sub {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.8;
    max-width: 440px;
    margin: 0 auto;
  }

  .meta {
    display: flex;
    justify-content: center;
    gap: 42px;
    list-style: none;
    margin: 38px 0 34px;
  }
  .meta li { display: flex; flex-direction: column; gap: 6px; }
  .meta strong {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(120deg, #a78bfa, #38bdf8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .meta span { font-size: 12px; color: var(--muted); letter-spacing: .5px; }

  .btn-primary {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    border: none;
    cursor: pointer;
    padding: 16px 54px;
    border-radius: 999px;
    background: linear-gradient(135deg, #7c6cf5, #a78bfa);
    box-shadow: 0 14px 34px -10px rgba(124,108,245,.9);
    transition: transform .2s, box-shadow .2s;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 42px -10px rgba(124,108,245,1);
  }
  .btn-primary:active { transform: translateY(0); }

  .tip { margin-top: 22px; font-size: 12.5px; color: #5f6779; }

  /* ============ 答题 ============ */
  .quiz-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    padding: 0 4px;
  }
  .progress-bar {
    flex: 1;
    height: 6px;
    border-radius: 99px;
    background: rgba(255,255,255,.08);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0;
    border-radius: 99px;
    background: linear-gradient(90deg, #7c6cf5, #38bdf8);
    transition: width .4s cubic-bezier(.4,0,.2,1);
  }
  .counter {
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: .5px;
    white-space: nowrap;
  }

  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 38px 34px 34px;
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 30px 70px -34px rgba(0,0,0,.95);
  }

  .q-index {
    font-size: 12px;
    letter-spacing: .18em;
    color: var(--accent-2);
    margin-bottom: 14px;
  }

  .q-text {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.6;
    letter-spacing: .2px;
    min-height: 64px;
  }

  .options { display: flex; gap: 10px; margin-top: 30px; }
  .options.vertical { flex-direction: column; gap: 9px; }

  .opt {
    flex: 1;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--muted);
    padding: 16px 4px;
    border-radius: 15px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.035);
    cursor: pointer;
    transition: all .18s ease;
    line-height: 1.35;
    text-align: center;
  }
  .opt:hover {
    background: rgba(124,108,245,.20);
    border-color: rgba(124,108,245,.65);
    color: #fff;
    transform: translateY(-3px);
  }
  .opt.selected {
    background: rgba(124,108,245,.42);
    border-color: #8b7cf6;
    color: #fff;
    box-shadow: 0 8px 24px -10px rgba(124,108,245,.9);
  }

  .options.vertical .opt {
    flex: none;
    text-align: left;
    padding: 15px 18px;
    font-size: 14px;
    line-height: 1.5;
  }
  .options.vertical .opt:hover { transform: translateX(3px); }

  .quiz-foot {
    display: flex;
    justify-content: flex-start;
    margin-top: 18px;
    padding: 0 4px;
  }
  .btn-ghost {
    font-family: inherit;
    font-size: 13px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px 4px;
    transition: color .2s;
  }
  .btn-ghost:hover { color: #fff; }

  /* ============ 加载 ============ */
  #loading { text-align: center; padding: 100px 0; }
  .spinner {
    width: 34px;
    height: 34px;
    margin: 0 auto 22px;
    border-radius: 50%;
    border: 2.5px solid rgba(255,255,255,.10);
    border-top-color: #7c6cf5;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13.5px; color: var(--muted); letter-spacing: .5px; }

  /* ============ 结果（Base64 输出） ============ */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 44px 36px 36px;
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: 0 30px 70px -34px rgba(0,0,0,.95);
    text-align: center;
  }

  .result-eyebrow {
    font-size: 11.5px;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .result-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -.3px;
    margin-bottom: 12px;
  }

  .result-sub {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.85;
    max-width: 360px;
    margin: 0 auto 26px;
  }

  .code-box {
    position: relative;
    text-align: left;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(124,108,245,.28);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
  }

  .code-label {
    font-size: 11px;
    letter-spacing: .22em;
    color: var(--accent-2);
    margin-bottom: 10px;
  }

  .code-text {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    color: #c8d0e0;
    word-break: break-all;
    -webkit-user-select: all;
    user-select: all;
    max-height: 220px;
    overflow-y: auto;
  }

  .code-hint {
    font-size: 11.5px;
    color: #5f6779;
    margin-bottom: 26px;
  }

  .btn-copy {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    border: none;
    cursor: pointer;
    padding: 16px 54px;
    border-radius: 999px;
    background: linear-gradient(135deg, #7c6cf5, #a78bfa);
    box-shadow: 0 14px 34px -10px rgba(124,108,245,.9);
    transition: transform .2s, box-shadow .2s, background .2s;
    width: 100%;
  }
  .btn-copy:hover {
    transform: translateY(-2px);
    box-shadow: 0 20px 42px -10px rgba(124,108,245,1);
  }
  .btn-copy:active { transform: translateY(0); }
  .btn-copy.copied {
    background: linear-gradient(135deg, #10b981, #34d399);
    box-shadow: 0 14px 34px -10px rgba(16,185,129,.9);
  }

  .btn-link {
    display: block;
    margin: 14px auto 0;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--muted);
    cursor: pointer;
    padding: 8px 12px;
    transition: color .2s;
  }
  .btn-link:hover { color: #fff; }

  @media (max-width: 560px) {
    h1.hero { font-size: 29px; }
    .q-card { padding: 28px 20px 24px; border-radius: 22px; }
    .q-text { font-size: 18px; min-height: 56px; }
    .result-card { padding: 34px 22px 30px; border-radius: 22px; }
    .result-title { font-size: 21px; }
    .btn-copy { font-size: 15px; padding: 15px 30px; }
    .options:not(.vertical) { flex-direction: column; }
    .opt { padding: 15px; font-size: 13.5px; }
    .meta { gap: 28px; }
    .code-text { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ========== 开始页 ========== -->
  <section id="intro" class="screen active">
    <div class="badge">MBTI</div>
    <h1 class="hero">人格类型测试</h1>
    <p class="sub">
      基于荣格心理类型理论的道题目，从外向/内向、实感/直觉、思考/情感、判断/知觉
      四个维度，帮你找到属于自己的 4 字母人格类型。
    </p>
    <ul class="meta">
      <li><strong>65</strong><span>题目数量</span></li>
      <li><strong>4</strong><span>测评维度</span></li>
      <li><strong>~8</strong><span>分钟完成</span></li>
    </ul>
    <button class="btn-primary" onclick="startTest()">开始测试</button>
    <p class="tip">请凭第一直觉作答，不必反复斟酌</p>
  </section>

  <!-- ========== 答题页 ========== -->
  <section id="quiz" class="screen">
    <div class="quiz-head">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="counter" id="counter">1 / 65</span>
    </div>

    <div class="q-card">
      <p class="q-index" id="qIndex">第 1 题</p>
      <h2 class="q-text" id="qText"></h2>
      <div class="options" id="options"></div>
    </div>

    <div class="quiz-foot">
      <button class="btn-ghost" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
    </div>
  </section>

  <!-- ========== 加载页 ========== -->
  <section id="loading" class="screen">
    <div class="spinner"></div>
    <p class="loading-text" id="loadingText">正在分析问卷数据…</p>
  </section>

  <!-- ========== 结果页（Base64 输出） ========== -->
  <section id="result" class="screen">
    <div class="result-card">
      <p class="result-eyebrow">ASSESSMENT COMPLETE</p>
      <h1 class="result-title">测评已完成</h1>
      <p class="result-sub">你的结果已编码为下方字符串。<br>请复制后发送给作者获取完整解读。</p>

      <div class="code-box">
        <div class="code-label">RESULT CODE</div>
        <div class="code-text" id="codeText"></div>
      </div>
      <p class="code-hint">点击编码可全选，或使用下方按钮一键复制</p>

      <button class="btn-copy" id="copyBtn" onclick="copyCode()">复制编码</button>
      <button class="btn-link" onclick="restart()">再测一次</button>
    </div>
  </section>

</div>

<script>
/* ============================================================
   题库：type = likert（态度自评）/ choice（情景选择）
   d = 维度，r = true 表示反向计分
   decoy = true 表示 MBTI 伪装题，仅作展示、不计入结果
   ============================================================ */
var rawQuestionBank = [
    // --- 维度A：感官偏好与审美 ---
    { type:'likert', d:'A', r:false, t:"在布置个人空间时，比起极简、硬朗的风格，我更希望环境能带给我一种被柔软包裹着的安全感。" },
    { type:'likert', d:'A', r:false, t:"选购日常用品（如文具、杯子）时，只要它的造型足够精巧可爱，哪怕稍微牺牲一点实用性我也愿意。" },
    { type:'likert', d:'A', r:false, t:"在欣赏影视或游戏时，我常常会把注意力放在角色服装的布料质感、垂坠感和细节花纹上。" },
    { type:'likert', d:'A', r:true,  t:"【反向】我认为日常穿搭的唯一标准就是耐脏、耐磨、方便活动，多余的装饰纯属累赘。" },
    { type:'likert', d:'A', r:false, t:"比起强烈的对比色或暗黑系，我对饱和度低、柔和的色系（如浅色调、马卡龙色）有天然的好感。" },
    { type:'likert', d:'A', r:false, t:"我觉得适度的自我修饰（比如保持发丝的柔顺、皮肤的触感）比糙汉子形象更能让人感到舒适。" },
    { type:'likert', d:'A', r:false, t:"我偶尔会被一些做工极度精致、小巧的手工艺品或饰品吸引，即便它们对我来说没有任何实用价值。" },
    { type:'likert', d:'A', r:true,  t:"【反向】我完全无法理解为什么有人要在物品上增加一些毫无用处的毛绒或挂坠。" },
    { type:'likert', d:'A', r:false, t:"我觉得带有一定曲线感或垂坠感的设计，比直来直去的几何线条更有美感。" },
    { type:'likert', d:'A', r:false, t:"买衣服时，哪怕是一件普通T恤，我也会非常在意它的领口形状是否显瘦、袖子是否有垂坠感。" },
    { type:'likert', d:'A', r:false, t:"我对带有水果香、奶香或花香气息的日用品（如沐浴露、护手霜）毫无抵抗力。" },
    { type:'likert', d:'A', r:false, t:"相比于金属或塑料材质，我潜意识里更喜欢抚摸珊瑚绒、丝绸等极度柔软的材料。" },
    { type:'likert', d:'A', r:true,  t:"【反向】挑选家居用品时，我更倾向于选择黑、灰、棕这类沉稳耐看的颜色，而不是浅色系。" },
    { type:'likert', d:'A', r:false, t:"我吃甜品或外观好看的食物时，第一反应往往是先欣赏它的造型并拍照，而不是立刻大口吃掉。" },
    { type:'likert', d:'A', r:false, t:"我非常在意自己身上的气味，衣服如果有一点异味或汗味会让我极其难受。" },
    { type:'likert', d:'A', r:true,  t:"【反向】我买鞋子只看重是否防滑耐穿，完全不在意它显得脚大还是脚小。" },
    { type:'likert', d:'A', r:false, t:"冬天的时候，我特别喜欢那种把手缩在宽大的袖子里，只露出一点点手指的感觉。" },
    { type:'likert', d:'A', r:false, t:"我吃水果或小零食的时候，喜欢把它们切成非常小块或者精致地摆盘后再吃。" },
    { type:'likert', d:'A', r:false, t:"看到非常精致的糕点或马卡龙，即使我不饿，也会因为它们看起来很好看而产生购买欲。" },
    { type:'likert', d:'A', r:false, t:"我对手部的保养比较在意，冬天洗完手会习惯性地涂抹护手霜以免干燥。" },
    { type:'likert', d:'A', r:true,  t:"【反向】我不理解为什么水杯需要各种颜色和造型，能装水喝不漏就行。" },

    // --- 维度B：肢体、空间与自我管理 ---
    { type:'likert', d:'B', r:false, t:"在公共场合坐下时，我的肢体习惯更偏向于收拢以避免占用过多空间，而不是随意舒展大张大合。" },
    { type:'likert', d:'B', r:false, t:"我对皮肤的触感很敏感，如果身上某处皮肤干燥起皮，我会觉得很难受并想办法去涂抹改善。" },
    { type:'likert', d:'B', r:false, t:"在关门、放杯子、敲键盘时，我通常会下意识控制力度，尽量不发出粗鲁的碰撞声。" },
    { type:'likert', d:'B', r:false, t:"我比较在意自己身体的洁净感，对明显的体毛、指甲边缘的不规整等细节会感到介意。" },
    { type:'likert', d:'B', r:true,  t:"【反向】我拿取东西时动作通常比较大，偶尔碰翻旁边的小物件也不觉得有什么。" },
    { type:'likert', d:'B', r:false, t:"在家独处放松时，我喜欢穿那种明显偏大、面料非常柔软、能把自己罩在里面的衣服。" },
    { type:'likert', d:'B', r:false, t:"吃带包装的零食时，我倾向于撕开一个整齐的小口子，而不是暴力扯烂整个包装袋。" },
    { type:'likert', d:'B', r:false, t:"拍照面对镜头时，我很少摆出那种很有攻击性或极其搞怪的动作，更倾向于收敛的姿态。" },
    { type:'likert', d:'B', r:true,  t:"【反向】我完全不在乎衣服是否有一点皱褶，只要没破我就能直接穿出门。" },
    { type:'likert', d:'B', r:false, t:"听到突然的巨响（如气球爆炸、重物掉落），我的身体会下意识地缩紧或轻微颤抖。" },
    { type:'likert', d:'B', r:false, t:"喝水或吃东西时，我习惯用小口咀嚼/吞咽，而不是狼吞虎咽。" },
    { type:'likert', d:'B', r:false, t:"双手捧着马克杯喝热饮时，我会觉得这个姿势让人有一种安心感。" },
    { type:'likert', d:'B', r:false, t:"在安静的环境里，我会下意识地放轻脚步和控制动作幅度，尽量避免引起别人的注意。" },
    { type:'likert', d:'B', r:true,  t:"【反向】我走路的时候步伐很大，且双臂摆动幅度明显，觉得这样走路带风。" },
    { type:'likert', d:'B', r:false, t:"走路时，我的脚尖通常是笔直向前或者微微内扣，几乎从来不会走外八字。" },
    { type:'likert', d:'B', r:false, t:"在沙发上休息时，我更喜欢把双腿蜷缩起来抱住，而不是把腿伸直摊开。" },
    { type:'likert', d:'B', r:true,  t:"【反向】我觉得吃饭发出声音或者大声吧唧嘴是很正常的事情，不在意这些细节。" },
    { type:'likert', d:'B', r:false, t:"如果地上掉了一个小东西，我通常会并拢双腿蹲下去捡，而不是直接双腿叉开弯腰去捡。" },
    { type:'likert', d:'B', r:false, t:"洗完脸后，我习惯用毛巾轻轻按压吸干水分，而不是用力在脸上来回粗暴地擦拭。" },
    { type:'likert', d:'B', r:false, t:"感到寒冷时，我会下意识地双臂抱在胸前，或者耸起肩膀缩起脖子取暖。" },
    { type:'likert', d:'B', r:true,  t:"【反向】我在家里经常光着膀子走来走去，觉得这样最放松自在。" },

    // --- 维度C：情感共鸣与防御机制 ---
    { type:'likert', d:'C', r:false, t:"玩沉浸式剧情游戏时，如果在做孤胆英雄拯救世界和被一个强大的存在无条件庇护之间选择，我内心其实更向往后者。" },
    { type:'likert', d:'C', r:false, t:"看电影时，我更容易因为人物之间微妙的遗憾和情感羁绊而难过，而不是因为宏大的悲剧场面。" },

    { type:'likert', d:'M', r:false, decoy:true, t:"我在意关系是否和谐，会尽量避免伤害别人的感情。" },
    // --- J / P ---
    { type:'likert', d:'M', r:false, decoy:true, t:"我喜欢提前把计划安排好。" },
    { type:'likert', d:'M', r:false, decoy:true, t:"我经常临时改变已经定好的计划。" },
    { type:'likert', d:'M', r:false, decoy:true, t:"做事时我喜欢有明确的时间表和步骤。" }

/* ============================================================
   常量与状态
   ============================================================ */
var standardOptions = [
    { l: '非常不符合', v: 1 },
    { l: '比较不符合', v: 2 },
    { l: '中立',       v: 3 },
    { l: '比较符合',   v: 4 },
    { l: '非常符合',   v: 5 }
];

var dimNames = { A: '审美偏好', B: '行为习惯', C: '心理共情', D: '社交亚文化' };

var shuffledQuestions = [];
var userAnswers = [];
var currentQIdx = 0;
var locked = false;
var dimMaxScores = { A: 0, B: 0, C: 0, D: 0 };
var currentCode = '';

/* ============================================================
   页面切换
   ============================================================ */
function showScreen(id) {
    var pages = ['intro', 'quiz', 'loading', 'result'];
    for (var i = 0; i < pages.length; i++) {
        document.getElementById(pages[i]).classList.remove('active');
    }
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============================================================
   题库抽取引擎（核心题 + MBTI 伪装题）
   ============================================================ */
function initGame() {
    var targetDistribution = {
        A: { likert: 9, choice: 3 },
        B: { likert: 9, choice: 4 },
        C: { likert: 9, choice: 3 },
        D: { likert: 9, choice: 4 }
    };
    var selectedQuestions = [];
    dimMaxScores = { A: 0, B: 0, C: 0, D: 0 };

    var corePool = [];
    var decoyPool = [];
    for (var pi = 0; pi < rawQuestionBank.length; pi++) {
        var item = rawQuestionBank[pi];
        if (item.decoy) decoyPool.push(item);
        else corePool.push(item);
    }

    for (var i = corePool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = corePool[i];
        corePool[i] = corePool[j];
        corePool[j] = temp;
    }

    var dims = ['A', 'B', 'C', 'D'];
    for (var di = 0; di < dims.length; di++) {
        var dim = dims[di];
        var types = ['likert', 'choice'];
        for (var ti = 0; ti < types.length; ti++) {
            var type = types[ti];
            var targetCount = targetDistribution[dim][type];
            var matchedInPool = [];
            for (var qi = 0; qi < corePool.length; qi++) {
                if (corePool[qi].d === dim && corePool[qi].type === type) {
                    matchedInPool.push(corePool[qi]);
                }
            }
            var drawn = matchedInPool.slice(0, targetCount);
            selectedQuestions = selectedQuestions.concat(drawn);
        }
    }

    var decoyCount = Math.min(15, decoyPool.length);
    for (var di2 = decoyPool.length - 1; di2 > 0; di2--) {
        var j2 = Math.floor(Math.random() * (di2 + 1));
        var temp2 = decoyPool[di2];
        decoyPool[di2] = decoyPool[j2];
        decoyPool[j2] = temp2;
    }
    var decoys = decoyPool.slice(0, decoyCount);
    selectedQuestions = selectedQuestions.concat(decoys);

    selectedQuestions.sort(function () { return Math.random() - 0.5; });
    shuffledQuestions = selectedQuestions;

    for (var k = 0; k < shuffledQuestions.length; k++) {
        if (!shuffledQuestions[k].decoy) {
            dimMaxScores[shuffledQuestions[k].d] += 5;
        }
    }
}

/* ============================================================
   答题流程
   ============================================================ */
function startTest() {
    initGame();
    currentQIdx = 0;
    locked = false;
    userAnswers = new Array(shuffledQuestions.length).fill(null);
    document.getElementById('progressFill').style.width = '0%';
    showScreen('quiz');
    renderQuestion();
}

function renderQuestion() {
    var q = shuffledQuestions[currentQIdx];
    var total = shuffledQuestions.length;

    document.getElementById('qIndex').textContent = '第 ' + (currentQIdx + 1) + ' 题';
    document.getElementById('qText').textContent = q.t.replace('【反向】', '');
    document.getElementById('counter').textContent = (currentQIdx + 1) + ' / ' + total;
    document.getElementById('progressFill').style.width = ((currentQIdx) / total * 100) + '%';
    document.getElementById('prevBtn').style.visibility = currentQIdx === 0 ? 'hidden' : 'visible';

    var box = document.getElementById('options');
    box.innerHTML = '';
    var isLikert = q.type === 'likert';
    box.className = isLikert ? 'options' : 'options vertical';

    var opts = isLikert ? standardOptions : q.options;
    for (var i = 0; i < opts.length; i++) {
        (function (opt) {
            var scoreVal = (isLikert && q.r) ? (6 - opt.v) : opt.v;
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'opt' + (userAnswers[currentQIdx] === scoreVal ? ' selected' : '');
            btn.textContent = opt.l;
            btn.addEventListener('click', function () { answer(scoreVal); });
            box.appendChild(btn);
        })(opts[i]);
    }
}

function answer(scoreVal) {
    if (locked) return;
    locked = true;
    userAnswers[currentQIdx] = scoreVal;
    renderQuestion();

    setTimeout(function () {
        locked = false;
        if (currentQIdx < shuffledQuestions.length - 1) {
            currentQIdx++;
            renderQuestion();
        } else {
            document.getElementById('progressFill').style.width = '100%';
            finishTest();
        }
    }, 260);
}

function prevQuestion() {
    if (locked || currentQIdx === 0) return;
    currentQIdx--;
    renderQuestion();
}

/* ============================================================
   加载 → 生成结果
   ============================================================ */
function finishTest() {
    setTimeout(function () {
        showScreen('loading');
        var allTexts = [
            '正在分析问卷数据…', '正在计算维度得分…',
            '正在编码测评结果…', '正在生成结果编码…'
        ];
        var texts = allTexts.sort(function () { return Math.random() - 0.5; }).slice(0, 4);
        var tIdx = 0;
        document.getElementById('loadingText').textContent = texts[0];
        var intv = setInterval(function () {
            tIdx++;
            if (tIdx < texts.length) {
                document.getElementById('loadingText').textContent = texts[tIdx];
            } else {
                clearInterval(intv);
                generateResult();
            }
        }, 560);
    }, 380);
}

/* ============================================================
   结果编码
   ============================================================ */
function generateResult() {
    showScreen('result');

    /* ---------- 计分（跳过伪装题） ---------- */
    var scores = { A: 0, B: 0, C: 0, D: 0 };
    for (var i = 0; i < shuffledQuestions.length; i++) {
        if (shuffledQuestions[i].decoy) continue;
        var dim = shuffledQuestions[i].d;
        scores[dim] += userAnswers[i] || 0;
    }

    var totalPercent = ((scores.A / dimMaxScores.A) + (scores.B / dimMaxScores.B) +
                        (scores.C / dimMaxScores.C) + (scores.D / dimMaxScores.D)) / 4 * 100;
    var displayScore = Math.round(totalPercent * 2.5);

    /* ---------- 四维百分比 ---------- */
    var dimPercents = [
        Math.round((scores.A / dimMaxScores.A) * 100),
        Math.round((scores.B / dimMaxScores.B) * 100),
        Math.round((scores.C / dimMaxScores.C) * 100),
        Math.round((scores.D / dimMaxScores.D) * 100)
    ];

    /* ---------- 中文 JSON payload ---------- */
    var payload = {
        "男娘测试综合分": displayScore + "/250",
        "维度百分比": {
            "审美偏好": dimPercents[0],
            "行为习惯": dimPercents[1],
            "心理共情": dimPercents[2],
            "社交亚文化": dimPercents[3]
        }
    };

    /* ---------- UTF-8 安全的 Base64 编码 ---------- */
    var json = JSON.stringify(payload);
    var b64 = btoa(unescape(encodeURIComponent(json)));
    currentCode = b64;

    /* ---------- 输出 ---------- */
    document.getElementById('codeText').textContent = b64;

    // 重置复制按钮状态
    var copyBtn = document.getElementById('copyBtn');
    copyBtn.textContent = '复制编码';
    copyBtn.classList.remove('copied');
}

/* ============================================================
   复制编码
   ============================================================ */
function copyCode() {
    if (!currentCode) {
        alert('编码尚未生成，请稍后再试。');
        return;
    }

    var copyBtn = document.getElementById('copyBtn');

    function onSuccess() {
        copyBtn.textContent = '已复制';
        copyBtn.classList.add('copied');
        setTimeout(function () {
            copyBtn.textContent = '复制编码';
            copyBtn.classList.remove('copied');
        }, 1800);
    }

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(currentCode).then(onSuccess).catch(function () {
            fallbackCopy(onSuccess);
        });
    } else {
        fallbackCopy(onSuccess);
    }
}

function fallbackCopy(onSuccess) {
    var textarea = document.createElement('textarea');
    textarea.value = currentCode;
    textarea.style.position = 'fixed';
    textarea.style.top = '-9999px';
    textarea.style.left = '-9999px';
    textarea.setAttribute('readonly', '');
    document.body.appendChild(textarea);
    textarea.select();
    textarea.setSelectionRange(0, currentCode.length);

    try {
        var ok = document.execCommand('copy');
        if (ok) {
            onSuccess();
        } else {
            alert('复制失败，请手动长按选择编码文本复制。');
        }
    } catch (e) {
        alert('复制失败，请手动长按选择编码文本复制。');
    }

    document.body.removeChild(textarea);
}

/* ============================================================
   重置
   ============================================================ */
function restart() {
    currentQIdx = 0;
    locked = false;
    userAnswers = [];
    currentCode = '';
    document.getElementById('progressFill').style.width = '0%';
    document.getElementById('codeText').textContent = '';
    showScreen('intro');
}
</script>
